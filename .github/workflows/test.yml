name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install homeassistant==2026.10.1
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q custom_components
      - run: node --check custom_components/tplink_ipc_local/www/camera-control-card.js
      - run: python scripts/check_public_tree.py
